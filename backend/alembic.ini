; FIDES backend — Alembic configuration (B1: Database Foundation)
;
; sqlalchemy.url is intentionally left blank here. The real connection
; string is read from the DATABASE_URL environment variable at runtime by
; migrations/env.py, so no credential of any kind lives in this file or
; in source control, per Tech Spec Sec. 22 ("Secrets never live in
; source control").

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
