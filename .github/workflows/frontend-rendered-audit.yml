name: Temporary rendered visual audit

on:
  push:
    branches:
      - feat/post-f6-follow-up

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Start visual fixture and compatibility proxy
        shell: bash
        run: |
          set -euo pipefail
          npm run preview:mvp > /tmp/fides-fixture.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8770/__fixture/reads >/dev/null 2>&1; then break; fi
            sleep .5
          done
          cat > /tmp/fides-proxy.cjs <<'NODE'
          const http=require("node:http");
          const TARGET="http://127.0.0.1:8770";
          const json=(res,status,value)=>{res.writeHead(status,{"content-type":"application/json","cache-control":"no-store"});res.end(JSON.stringify(value));};
          async function target(path,auth,init={}) {
            const headers={...(auth?{authorization:auth}:{}),...(init.headers||{})};
            const response=await fetch(TARGET+path,{...init,headers});
            const text=await response.text();
            let data=null;try{data=text?JSON.parse(text):null;}catch{data=text;}
            return {status:response.status,data,headers:response.headers};
          }
          function other(parent,me){
            return parent.borrower.id===me.id?parent.lender:parent.borrower;
          }
          http.createServer(async(req,res)=>{
            const u=new URL(req.url,"http://127.0.0.1:8771"),path=u.pathname,auth=req.headers.authorization||"";
            let raw="";for await(const chunk of req)raw+=chunk;
            let body={};if(raw){try{body=JSON.parse(raw)}catch{}}
            try{
              if(path==="/api/v1/notification-preferences"){
                if(req.method==="GET")return json(res,200,{due_reminders_enabled:true,overdue_reminders_enabled:true});
                if(req.method==="POST")return json(res,200,{due_reminders_enabled:!!body.due_reminders_enabled,overdue_reminders_enabled:!!body.overdue_reminders_enabled});
              }
              if(path==="/api/v1/summary/upcoming"||path==="/api/v1/summary/overdue"){
                const me=(await target("/api/v1/me",auth)).data;
                const rows=(await target("/api/v1/commitments",auth)).data||[];
                const parent=rows.find(r=>["ACTIVE","PARTIALLY_REPAID"].includes(r.status))||rows[0];
                if(!parent)return json(res,200,{items:[],next_cursor:null});
                const cp=other(parent,me),isUpcoming=path.endsWith("upcoming"),page=u.searchParams.get("cursor");
                const base={
                  commitment_id:parent.id,
                  counterparty:{id:cp.id,display_name:page?cp.display_name:"Morgan Alexander Verylongcounterpartynamewithoutspaces"},
                  role:parent.borrower.id===me.id?"BORROWER":"LENDER",
                  currency:parent.currency,
                  verified_outstanding_minor:page?123456789:9876543210123,
                  due_timezone:"Asia/Kolkata",
                };
                const items=page?
                  [{...base,due_date:isUpcoming?"2026-10-10":"2026-09-28",schedule_mode:"single",installment_id:null}]:
                  [{...base,due_date:isUpcoming?"2026-10-07":"2026-09-30",schedule_mode:"single",installment_id:null},
                   {...base,due_date:isUpcoming?"2026-10-08":"2026-09-29",schedule_mode:"installments",installment_id:"00000000-0000-4000-8000-000000000099"}];
                return json(res,200,{items,next_cursor:page?null:"fixture:due:2"});
              }
              const closureList=path.match(/^\/api\/v1\/commitments\/([^/]+)\/closure-requests$/);
              if(closureList){
                const parent=(await target("/api/v1/commitments/"+closureList[1],auth)).data;
                const me=(await target("/api/v1/me",auth)).data,cp=other(parent,me),now="2026-10-04T12:00:00Z";
                if(req.method==="GET")return json(res,200,[
                  {id:"00000000-0000-4000-8000-000000000090",commitment_id:parent.id,requested_by:cp,counterparty:{id:me.id,display_name:me.display_name},status:"REQUESTED",currency:parent.currency,outstanding_snapshot_minor:9876543210123,waived_amount_minor:9876543210123,note:"A long but bounded mutual-closure note that should wrap cleanly without obscuring any authoritative amount. ".repeat(3),decided_by:null,decided_at:null,created_at:now,updated_at:now},
                  {id:"00000000-0000-4000-8000-000000000091",commitment_id:parent.id,requested_by:{id:me.id,display_name:me.display_name},counterparty:cp,status:"ACCEPTED",currency:parent.currency,outstanding_snapshot_minor:1250000,waived_amount_minor:1250000,note:"Earlier closure record.",decided_by:cp,decided_at:"2026-10-03T10:00:00Z",created_at:"2026-10-03T09:00:00Z",updated_at:"2026-10-03T10:00:00Z"}
                ]);
                if(req.method==="POST")return json(res,201,{id:"00000000-0000-4000-8000-000000000092",commitment_id:parent.id,requested_by:{id:me.id,display_name:me.display_name},counterparty:cp,status:"REQUESTED",currency:parent.currency,outstanding_snapshot_minor:1250000,waived_amount_minor:1250000,note:body.note??null,decided_by:null,decided_at:null,created_at:now,updated_at:now});
              }
              const closureAction=path.match(/^\/api\/v1\/closure-requests\/([^/]+)\/(accept|reject|cancel)$/);
              if(closureAction){
                const me=(await target("/api/v1/me",auth)).data,rows=(await target("/api/v1/commitments",auth)).data||[],parent=rows.find(r=>["ACTIVE","PARTIALLY_REPAID"].includes(r.status))||rows[0],cp=other(parent,me);
                const status={accept:"ACCEPTED",reject:"REJECTED",cancel:"CANCELLED"}[closureAction[2]],now="2026-10-04T12:00:00Z";
                return json(res,200,{id:closureAction[1],commitment_id:parent.id,requested_by:closureAction[2]==="cancel"?{id:me.id,display_name:me.display_name}:cp,counterparty:closureAction[2]==="cancel"?cp:{id:me.id,display_name:me.display_name},status,currency:parent.currency,outstanding_snapshot_minor:1250000,waived_amount_minor:1250000,note:"Closure review.",decided_by:{id:me.id,display_name:me.display_name},decided_at:now,created_at:"2026-10-03T09:00:00Z",updated_at:now});
              }
              const headers={};for(const [k,v] of Object.entries(req.headers))if(!["host","content-length"].includes(k)&&v!==undefined)headers[k]=v;
              const upstream=await fetch(TARGET+u.pathname+u.search,{method:req.method,headers,body:["GET","HEAD"].includes(req.method)?undefined:raw});
              res.writeHead(upstream.status,Object.fromEntries([...upstream.headers].filter(([k])=>!["content-length","content-encoding","transfer-encoding"].includes(k.toLowerCase()))));
              res.end(Buffer.from(await upstream.arrayBuffer()));
            }catch(e){json(res,500,{error:{code:"AUDIT_PROXY_ERROR",message:String(e)}});}
          }).listen(8771,"127.0.0.1");
          NODE
          node /tmp/fides-proxy.cjs > /tmp/fides-proxy.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8771/__fixture/reads >/dev/null 2>&1; then break; fi
            sleep .5
          done
      - name: Start web
        shell: bash
        run: |
          set -euo pipefail
          FIDES_BACKEND_API_URL=http://127.0.0.1:8771/api/v1 NEXT_PUBLIC_API_BASE_URL=/api/v1 npm run web -- --hostname 127.0.0.1 --port 3006 > /tmp/fides-web.log 2>&1 &
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:3006/login >/dev/null 2>&1; then exit 0; fi
            sleep .5
          done
          cat /tmp/fides-web.log
          exit 1
      - name: Render and inspect release flow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-audit
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/fides-chrome about:blank >/tmp/chrome.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1; then break; fi
            sleep .25
          done
          cat > /tmp/render-audit.cjs <<'NODE'
          const http=require("node:http"),fs=require("node:fs");
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const getJSON=url=>new Promise((resolve,reject)=>http.get(url,r=>{let s="";r.on("data",c=>s+=c);r.on("end",()=>{try{resolve(JSON.parse(s))}catch(e){reject(e)}})}).on("error",reject));
          class CDP{
            constructor(url){this.ws=new WebSocket(url);this.id=0;this.pending=new Map();this.ready=new Promise((r,j)=>{this.ws.onopen=r;this.ws.onerror=j});this.ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&this.pending.has(m.id)){const {r,j}=this.pending.get(m.id);this.pending.delete(m.id);m.error?j(new Error(JSON.stringify(m.error))):r(m.result)}}}
            async send(method,params={}){await this.ready;const id=++this.id;this.ws.send(JSON.stringify({id,method,params}));return new Promise((r,j)=>this.pending.set(id,{r,j}));}
          }
          (async()=>{
            const pages=await getJSON("http://127.0.0.1:9222/json/list"),c=new CDP(pages[0].webSocketDebuggerUrl);
            await c.send("Page.enable");await c.send("Runtime.enable");await c.send("Emulation.setFocusEmulationEnabled",{enabled:true});
            const evaluate=async expression=>{const out=await c.send("Runtime.evaluate",{expression,returnByValue:true,awaitPromise:true});if(out.exceptionDetails)throw new Error(JSON.stringify(out.exceptionDetails));return out.result.value};
            const wait=async(expr,ms=12000)=>{const end=Date.now()+ms;while(Date.now()<end){try{if(await evaluate("Boolean("+expr+")"))return}catch{}await sleep(150)}throw new Error("Timeout: "+expr)};
            const nav=async path=>{await c.send("Page.navigate",{url:"http://127.0.0.1:3006"+path});await wait("document.readyState==='complete'");await sleep(700)};
            const setValue=async(sel,value)=>evaluate(`(()=>{const el=document.querySelector(${JSON.stringify(sel)});if(!el)return false;const proto=el.tagName==="TEXTAREA"?HTMLTextAreaElement.prototype:HTMLInputElement.prototype;Object.getOwnPropertyDescriptor(proto,"value").set.call(el,${JSON.stringify(value)});el.dispatchEvent(new Event("input",{bubbles:true}));el.dispatchEvent(new Event("change",{bubbles:true}));return true})()`);
            const clickHref=async href=>{await evaluate(`(()=>{const a=[...document.querySelectorAll("a")].find(x=>x.getAttribute("href")===${JSON.stringify(href)});if(!a)return false;a.click();return true})()`);await sleep(900)};
            const clickText=async(text,selector="button,a")=>{const ok=await evaluate(`(()=>{const n=[...document.querySelectorAll(${JSON.stringify(selector)})].find(x=>x.textContent.trim().includes(${JSON.stringify(text)}));if(!n)return false;n.click();return true})()`);await sleep(700);return ok};
            const report=[];
            async function capture(name,width,height){
              await c.send("Emulation.setDeviceMetricsOverride",{width,height,deviceScaleFactor:1,mobile:false});
              await sleep(250);
              const metric=await evaluate(`(()=>{const d=document.documentElement;const all=[...document.querySelectorAll("*")];const overflow=all.filter(e=>{const r=e.getBoundingClientRect();return r.right>innerWidth+1||r.left<-1}).slice(0,12).map(e=>({tag:e.tagName,cls:e.className,text:(e.textContent||"").trim().slice(0,80),right:Math.round(e.getBoundingClientRect().right)}));return {path:location.pathname,width:innerWidth,height:innerHeight,scrollWidth:d.scrollWidth,clientWidth:d.clientWidth,overflow,text:document.body.innerText.slice(0,1200)}})()`);
              const layout=await c.send("Page.getLayoutMetrics"),w=Math.max(width,Math.ceil(layout.cssContentSize.width)),h=Math.min(7000,Math.max(height,Math.ceil(layout.cssContentSize.height)));
              const shot=await c.send("Page.captureScreenshot",{format:"png",captureBeyondViewport:true,fromSurface:true,clip:{x:0,y:0,width:w,height:h,scale:1}});
              fs.writeFileSync("visual-audit/"+name+".png",Buffer.from(shot.data,"base64"));report.push({name,...metric});
            }
            await nav("/");await capture("welcome-desktop",1280,900);await capture("welcome-phone",390,844);
            await nav("/login");await capture("login-phone-step",390,844);
            await setValue('input[type="tel"]',"+12025550101");await evaluate("document.querySelector('form').requestSubmit()");await wait("document.querySelector('input[inputmode="numeric"]')");await capture("login-otp-step",390,844);
            await setValue('input[inputmode="numeric"]',"654321");await evaluate("document.querySelector('form').requestSubmit()");await wait("location.pathname==='/app/overview'",15000);await sleep(1200);
            for(const [n,w,h] of [["overview-desktop",1280,1000],["overview-tablet",768,1024],["overview-phone",390,844],["overview-200pct-equivalent",640,900]])await capture(n,w,h);
            await clickHref("/app/connections");await wait("document.querySelector('h1')?.textContent.includes('Connections')");await capture("connections-desktop",1280,1000);await capture("connections-phone",390,844);
            const connHref=await evaluate(`[...document.querySelectorAll('a[href^="/app/connections/"]')].map(a=>a.getAttribute('href')).find(h=>h!=="/app/connections/new")||null`);
            if(connHref){await clickHref(connHref);await wait("document.querySelector('h1')?.textContent.includes('Connection detail')");await capture("connection-detail-phone",390,844);}
            await clickHref("/app/overview");await wait("document.querySelector('h1')?.textContent.includes('Overview')");
            const commitmentHrefs=await evaluate(`[...new Set([...document.querySelectorAll('a[href^="/app/commitments/"]')].map(a=>a.getAttribute('href')).filter(h=>h&&h!=="/app/commitments/new"&&!h.includes("/extensions/")&&!h.includes("/repayments/")))]`);
            let detailHref=commitmentHrefs[0]||null,extensionHref=null,pendingRepaymentHref=null;
            for(const href of commitmentHrefs){
              await clickHref(href);await wait("document.querySelector('h1')?.textContent.includes('Commitment detail')");
              const found=await evaluate(`(()=>({extension:[...document.querySelectorAll('a')].find(a=>a.getAttribute('href')?.endsWith('/extensions/new'))?.getAttribute('href')||null,pending:[...document.querySelectorAll('.card')].find(c=>c.textContent.includes('Pending verification'))?.querySelector('a[href^="/app/repayments/"]')?.getAttribute('href')||null}))()`);
              if(!detailHref)detailHref=href;if(found.extension&&!extensionHref)extensionHref=found.extension;if(found.pending&&!pendingRepaymentHref)pendingRepaymentHref=found.pending;
              if(extensionHref&&pendingRepaymentHref)break;
              await clickHref("/app/overview");await wait("document.querySelector('h1')?.textContent.includes('Overview')");
            }
            if(detailHref){await clickHref(detailHref);await wait("document.querySelector('h1')?.textContent.includes('Commitment detail')");await capture("commitment-detail-desktop",1280,1800);await capture("commitment-detail-phone",390,1200);await capture("commitment-detail-200pct-equivalent",640,1200);
              const reportHref=await evaluate(`[...document.querySelectorAll('a')].find(a=>a.getAttribute('href')?.endsWith('/repayments/new'))?.getAttribute('href')||null`);
              if(reportHref){await clickHref(reportHref);await wait("document.querySelector('h1')?.textContent.includes('Report repayment')");await capture("report-repayment-phone",390,900);}
            }
            if(pendingRepaymentHref){await clickHref("/app/overview");await wait("document.querySelector('h1')?.textContent.includes('Overview')");await clickHref(pendingRepaymentHref);await wait("document.querySelector('h1')?.textContent.includes('Repayment detail')");await capture("verify-dispute-phone",390,900);await capture("verify-dispute-desktop",1280,1000);}
            if(extensionHref){await clickHref("/app/overview");await wait("document.querySelector('h1')?.textContent.includes('Overview')");await clickHref(extensionHref);await wait("document.querySelector('h1')?.textContent.includes('Request extension')");await capture("extension-phone",390,900);}
            await clickHref("/app/notifications");await wait("document.querySelector('h1')?.textContent.includes('Notifications')");await capture("notifications-phone",390,900);await capture("notifications-desktop",1280,1000);
            await clickHref("/app/profile");await wait("document.querySelector('h1')?.textContent.includes('Profile')");await capture("profile-phone",390,1000);await capture("profile-desktop",1280,1000);
            fs.writeFileSync("visual-audit/audit.json",JSON.stringify(report,null,2));
            const failures=report.filter(x=>x.scrollWidth>x.clientWidth+1||x.overflow.length);
            console.log(JSON.stringify({screens:report.length,failures},null,2));
            process.exit(failures.length?2:0);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/render-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-visual-audit
          path: frontend/visual-audit
          retention-days: 1
